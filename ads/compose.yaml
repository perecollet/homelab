# ads/compose.yaml — AdGuard Home (DNS-level ad blocking, LAN only)
services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    ports:
      - "192.168.1.62:53:53/tcp"
      - "192.168.1.62:53:53/udp"
    volumes:
      - /srv/adguard/work:/opt/adguardhome/work
      - /srv/adguard/conf:/opt/adguardhome/conf
    networks:
      - proxy-nw
    healthcheck:
      # AdGuard es imagen scratch: trae nslookup vía busybox, NO dig.
      test: ["CMD-SHELL", "nslookup -type=a google.com 127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - autoheal=true

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  proxy-nw:
    external: true
